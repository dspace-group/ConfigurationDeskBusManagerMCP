name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.0
        required: true
        type: string
      release_notes:
        description: Optional Markdown release notes. Leave blank to use the built-in v0.1.0 notes.
        required: false
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple
  PYTHON_VERSION: "3.11"

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $expectedRef = "refs/heads/$($env:DEFAULT_BRANCH)"
            if ($env:GITHUB_REF -ne $expectedRef) {
              throw "Manual releases must run from '$env:DEFAULT_BRANCH'."
            }
            $version = $env:REQUESTED_VERSION
          } else {
            if ($env:GITHUB_REF_TYPE -ne "tag") {
              throw "Release workflow must run from a semantic version tag."
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version '$version' must use MAJOR.MINOR.PATCH."
          }

          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sync release environment
        run: uv sync --frozen --all-packages --group build --python ${{ env.PYTHON_VERSION }}

      - name: Validate release source
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ExpectedVersion ${{ steps.version.outputs.value }}

      - name: Build executable
        shell: pwsh
        run: ./scripts/build-exe.ps1

      - name: Validate executable
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ExpectedVersion ${{ steps.version.outputs.value }} -SkipPackageBuild -ExecutablePath ./dist/configurationdesk-mcp.exe

      - name: Create release notes
        shell: pwsh
        env:
          CUSTOM_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CUSTOM_RELEASE_NOTES)) {
            Set-Content -LiteralPath release-notes.md -Value $env:CUSTOM_RELEASE_NOTES -Encoding utf8
            exit 0
          }

          @"
          ## ConfigurationDesk MCP Server v${{ steps.version.outputs.value }}

          ### Overview

          This initial release provides a Model Context Protocol server for
          discovering and automating dSPACE ConfigurationDesk and Bus Manager
          workflows through MCP-compatible clients.

          ### What is included

          The server exposes 77 tools across 12 domains, together with 11
          resources and 15 workflow prompts. It supports:

          - ConfigurationDesk startup, diagnostics, lifecycle, save, undo, and redo
          - Project, application, and configuration-tree management
          - Model topology, model ports, and application-process management
          - Hardware-platform setup, imported topology, hardware scanning, and VEOS configuration
          - Communication-matrix import and inspection for ARXML, DBC, and LDF inputs
          - Bus configuration, restbus assignment, features, ports, BSC output, and bus access
          - I/O function blocks, channel assignment, conflict-aware builds, and working views

          Tool responses include structured success, verification, error,
          recovery, and next-action information. Large read operations support
          pagination, and tool annotations identify read-only, destructive,
          idempotent, and external-system operations.

          ### Windows executable

          `configurationdesk-mcp.exe` is a Windows x64 MCP stdio server. It
          bundles Python and open-source Python dependencies only. It does not
          include dSPACE ConfigurationDesk, a ConfigurationDesk license,
          hardware drivers, dSPACE helper packages, or project assets.

          Verify the executable before use:

          ```powershell
          Get-FileHash .\configurationdesk-mcp.exe -Algorithm SHA256
          .\configurationdesk-mcp.exe --version
          .\configurationdesk-mcp.exe --list-tools
          ```

          Compare the hash with `configurationdesk-mcp.exe.sha256`. The initial
          executable is unsigned, so Windows may display a reputation warning.

          ### Requirements and compatibility

          - 64-bit Windows 10 or Windows 11
          - A local, licensed ConfigurationDesk installation registered for COM automation when using COM tools
          - ConfigurationDesk 2026-A (26.2) is the tested reference version; other compatible releases are not validated by this repository

          ### Transport support

          The supported public transport is local MCP stdio. Streamable HTTP is
          disabled by default and, if explicitly enabled, must remain
          loopback-only. It has no built-in authentication and must not be
          exposed to an external or untrusted network.

          ### Release assets

          - `configurationdesk-mcp.exe`
          - `configurationdesk-mcp.exe.sha256`
          - `configurationdesk-mcp-third-party-licenses.zip`
          - `LICENSE`
          - `THIRD-PARTY-NOTICES.md`

          ### Notices

          See `LICENSE`, `THIRD-PARTY-NOTICES.md`, and
          `configurationdesk-mcp-third-party-licenses.zip` in this release.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/configurationdesk-mcp.exe
            dist/configurationdesk-mcp.exe.sha256
            dist/configurationdesk-mcp-third-party-licenses.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.value }}
          body_path: release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/configurationdesk-mcp.exe
            dist/configurationdesk-mcp.exe.sha256
            dist/configurationdesk-mcp-third-party-licenses.zip
            LICENSE
            THIRD-PARTY-NOTICES.md
