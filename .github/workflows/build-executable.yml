name: Build Executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync build environment
        run: uv sync --frozen --all-packages --group build --python ${{ env.PYTHON_VERSION }}

      - name: Validate source release content
        shell: pwsh
        run: ./scripts/validate-release.ps1 -SkipPackageBuild

      - name: Build executable
        shell: pwsh
        run: ./scripts/build-exe.ps1

      - name: Validate executable
        shell: pwsh
        run: ./scripts/validate-release.ps1 -SkipPackageBuild -ExecutablePath ./dist/configurationdesk-mcp.exe

      - name: Upload executable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configurationdesk-mcp-${{ github.sha }}
          path: |
            dist/configurationdesk-mcp.exe
            dist/configurationdesk-mcp.exe.sha256
            dist/configurationdesk-mcp-third-party-licenses.zip
          retention-days: 30
          if-no-files-found: error
