# uv workspace root for the ConfigurationDesk MCP Server.
#
# This repository is managed with uv (https://docs.astral.sh/uv/). The two
# publishable packages below are workspace members that share a single
# environment (.venv) and a single lockfile (uv.lock):
#
#   configurationdesk_com_bridge  — open-source COM automation library (SDK)
#   ConfigurationDeskMCP          — the FastMCP server (depends on the bridge)
#
# This root pyproject is a *virtual* workspace root: it is not itself a
# publishable package, it only wires the workspace together.
#
# Common commands:
#   uv sync --all-packages          install every member (editable) + dev tools
#   uv run configurationdesk-mcp    run the server
#   uv run pytest ConfigurationDeskMCP/tests
#   uv run --group build pyinstaller packaging/pyinstaller.spec

[tool.uv.workspace]
members = [
    "configurationdesk_com_bridge",
    "ConfigurationDeskMCP",
]

# The server depends on the bridge; resolve it from the workspace, not an index.
# Root sources apply to every workspace member.
[tool.uv.sources]
configurationdesk-com-bridge = { workspace = true }

# Development tooling shared across the workspace. Installed by default on
# `uv sync` (the `dev` group is included unless you pass `--no-dev`). Runtime
# dependencies belong to the publishable workspace packages below.
[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
build = [
    "pyinstaller>=6.21.0,<7",
]

# Public PyPI is uv's default package index. Internal mirrors, if needed for a
# private build, are supplied by the invoking environment and are not tracked.
